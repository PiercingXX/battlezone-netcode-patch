[Net]

; Ping ceiling before Net::AdjustBandwidth starts cutting the send rate.
; Stock 300 turns a jitter spike into a rate cut into more queueing into a
; bigger spike.  450 gives jittery links headroom before the governor bites.
MaxPing = 450

; Bytes added to the send budget per adjustment while under MaxPing.
; Twice DownCount, as stock intends: the governor must recover faster than it
; cuts, or a traffic spike ratchets the rate down and never lets it back up.
; Measured 2026-08-12 at the old 50/200: -203 B/s per second down, +40.5 up.
UpCount = 100

; Bytes removed per adjustment while over MaxPing.
DownCount = 50

; Send-rate floor.  Stock 4000 (4 KB/s) lets one bad stretch collapse the
; rate to a trickle; 16000 keeps the game state flowing during recovery.
; Observed 2026-08-12: a collapse bottomed out at 4,150 B/s, so the stock
; floor is what was in force and this file was not being applied.  The proxy
; now writes this value directly (shared/net_globals.h).
MinBandwidth = 16000

; Send-rate ceiling.  The common community "Auto-Kick Reduction Patch"
; caps this at 32000 (32 KB/s) which itself causes lag on modern links.
; 64000 is 4x stock and ~2.5x the highest send rate ever measured across
; nine instrumented 2026-08-15 matches (24,872 B/s peak).
MaxBandwidth = 64000

; Auto-kick.  A tick is bad when ping > AutoKickPing OR loss > AutoKickLoss;
; bad for AutoKickTime straight and the host ejects the player.
;
; V5.2 restores the V4.9 values entire.  V5.0 cut all four to ~2x stock and
; ejected a live tester twice in one evening, at exactly Start+Time each time;
; V5.1 reverted Ping and Time but kept Loss=50, and live use surfaced more
; problems.  These are the numbers that ran clean on 2026-08-12.
;
; Known cost: Loss=200 is very likely unreachable, so a peer that goes truly
; dead will not be kicked and the match runs on until someone aborts.  Set
; BZ_AUTOKICK_LOSS=50 on the host to re-arm that.  See shared/net_globals.h.
AutoKickStart = 60000
AutoKickPing = 2000
AutoKickLoss = 200
AutoKickTime = 60000

; Packet compression: keep enabled, less data per packet.
UseCompression = 1

; The game only loads net.ini through the mod system - a copy in the game
; folder root is silently ignored (verified in live testing).  Installers
; place this file in packaged_mods/9990001/ so the mod scanner finds it.
[DESCRIPTION]
missionName = "BZ Netcode Patch - Host Tuning"

[WORKSHOP]
mapType = "mod"
customtags = "Battlezone, Patch, net, ini, netcode"
